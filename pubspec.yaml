name: trouvemoi
description: Application Flutter pour retrouver des pieces d'identite perdues.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.6.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  firebase_auth: ^5.3.4
  firebase_core: ^3.9.0
  firebase_storage: ^12.3.7
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  go_router: ^14.6.2
  google_sign_in:
  image_picker: ^1.1.2
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  connectivity_plus: ^7.3.1
  google_mobile_ads: ^9.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
